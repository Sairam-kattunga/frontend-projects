<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octagon Menu</title>
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    
    <ul class="menu">
      <div class="menuToggle"><ion-icon name="add-outline"></ion-icon></div>
      <li style="--i: 0; --clr: #ff2972">
        <a href="#"><ion-icon name="cloud-outline"></ion-icon></a>
      </li>
      <li style="--i: 1; --clr: #fee800">
        <a href="https://www.youtube.com/"><ion-icon name="logo-youtube"></ion-icon></a>
      </li>
      <li style="--i: 2; --clr: #04fc43">
        <a href="https://www.facebook.com/"><ion-icon name="logo-facebook"></ion-icon></a>
      </li>
      <li style="--i: 3; --clr: #fe00f1">
        <a href="https://www.instagram.com/"><ion-icon name="logo-instagram"></ion-icon></a>
      </li>
      <li style="--i: 4; --clr: #00b0fe">
        <a href="https://www.snapchat.com/"><ion-icon name="logo-snapchat"></ion-icon></a>
      </li>
      <li style="--i: 5; --clr: #fea600">
        <a href="https://www.chrome.com/"><ion-icon name="logo-chrome"></ion-icon></a>
      </li>
      <li style="--i: 6; --clr: #a529ff">
        <a href="https://www.amazon.com/"><ion-icon name="logo-amazon"></ion-icon></a>
      </li>
      <li style="--i: 7; --clr: #01bdab">
        <a href="https://www.whatsapp.com/"><ion-icon name="logo-whatsapp"></ion-icon></a>
      </li>
    </ul>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <script>
      let menuToggle = document.querySelector(".menuToggle");
      let menu = document.querySelector(".menu");
      menuToggle.onclick = function () {
        menu.classList.toggle("active");
      };
    </script>
  </body>
</html>
